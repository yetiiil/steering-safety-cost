# Per-layer target L2 norm for CAA steering vectors, one entry per model.
#
# normalize_vectors.py rescales every behaviour's raw vector at a given layer to a
# single shared norm, so that a multiplier means the same thing across behaviours.
# The published vectors used the mean raw norm over the seven behaviours that were
# present when they were generated -- three of which (coordinate-itself,
# coordinate-other-ais, wealth-seeking-inclination) this paper never reports.
#
# Recording the resulting norms here removes that dependency: reproducing the
# published scale no longer requires generating vectors for behaviours the paper
# does not use. Normalising over the paper's behaviours alone would instead shrink
# the target by about 3% at the steering layers, and by up to 14% at the last layer,
# which would silently change what every multiplier means.
#
# Values were recovered from the released normalized vectors and agree with them to
# within 0.011% at every layer of every model.

